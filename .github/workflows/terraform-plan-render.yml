name: Terraform plan (Render)

on:
  pull_request:
    paths:
      - "infra-render/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-render
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # Render doesn't offer GitHub OIDC federation the way AWS does (see terraform-plan.yml for
      # that pattern) — this has to be a plain encrypted repo secret.
      #
      # Also unlike the AWS config, this one deliberately uses local state (see versions.tf) —
      # so init here has nothing to connect to, and the plan below is really "what would this
      # create from nothing", not a true diff against whatever is actually deployed from your
      # own machine. That's an honest limitation of the no-AWS-account setup, not a bug: good
      # enough to catch syntax/logic errors on a PR, not a substitute for running `terraform
      # plan` yourself before `apply`.
      - name: terraform init
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: terraform plan -no-color -input=false
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true

      - name: Comment plan on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan (Render)
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
