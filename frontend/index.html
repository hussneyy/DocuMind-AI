<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap"
      rel="stylesheet"
    />
    <title>DocuMind AI — Intelligent Document Search &amp; AI Knowledge Assistant</title>
    <meta name="description" content="Upload PDFs, search them with natural language, and get grounded AI answers with source citations." />
    <script>
      // Applied synchronously, before the first paint, so there's no flash of the wrong theme
      // while React mounts and ThemeContext runs its own effect. Mirrors exactly what
      // ThemeContext reads/writes (the "documind-theme" localStorage key) — keep both in sync.
      (function () {
        try {
          var stored = localStorage.getItem('documind-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* localStorage can throw in a locked-down context (e.g. some private-browsing modes) — default to light. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
