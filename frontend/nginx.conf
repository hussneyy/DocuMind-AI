# Serves the built SPA and reverse-proxies /api and /health to the "api" container (its
# docker-compose service name — resolved via Docker's embedded DNS) under the SAME origin this
# server is reached at. That's deliberate: it means the browser never needs CORS for the deployed
# stack at all (the frontend's own apiClient already defaults to a relative "/api" base URL), and
# the auth cookie's SameSite=Lax works the same way it does in local dev's Vite-proxy setup.
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://api:8080/health/;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Client-side routing (React Router): any path not matching a real static file falls
        # back to index.html, which then renders the right route on the client.
        try_files $uri $uri/ /index.html;
    }
}
